name: Evaluate speech models

# On-demand only. Downloads and runs candidate whisper models through the real
# engine on a Windows runner, so the catalog's claims about a model - that it
# loads at all, roughly what it costs in time and memory - come from a
# measurement rather than from an assumption.
#
# It downloads over a gigabyte and takes a while, so it is never attached to a
# push. The numbers it produces describe the GitHub runner, not the user's
# laptop; docs/ARCHITECTURE.md says so wherever they are quoted.
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Whitespace separated ggml file names from ggerganov/whisper.cpp'
        required: true
        default: 'ggml-medium-q5_0.bin ggml-large-v3-turbo-q5_0.bin'
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  evaluate:
    name: Run candidate models through the real engine
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the speech tests
        run: dotnet build tests/MeetingRecorder.Stt.Tests/MeetingRecorder.Stt.Tests.csproj --configuration Release

      - name: Synthesise speech to transcribe
        id: speech
        # Windows PowerShell 5.1: System.Speech is not in the .NET Core BCL that
        # pwsh 7 loads, so SAPI is only reachable from the desktop runtime.
        # Pure ASCII on purpose - a non-ASCII literal in a `shell: powershell`
        # step breaks the parser rather than merely displaying wrongly.
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "${{ github.workspace }}/.test-audio"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $path = Join-Path $dir "speech.wav"

          Add-Type -AssemblyName System.Speech
          $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voices = $synth.GetInstalledVoices() | ForEach-Object { $_.VoiceInfo }
          if (-not $voices) { throw "No speech voices are installed on this runner." }

          $japanese = $voices | Where-Object { $_.Culture.Name -like 'ja*' } | Select-Object -First 1
          if ($japanese) {
            $synth.SelectVoice($japanese.Name)
            $sampleFile = "${{ github.workspace }}/tools/speech-sample-ja.txt"
            $language = "ja"
          } else {
            $sampleFile = "${{ github.workspace }}/tools/speech-sample-en.txt"
            $language = "en"
          }

          $text = [System.IO.File]::ReadAllText($sampleFile, [System.Text.Encoding]::UTF8).Trim()
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $synth.SetOutputToWaveFile($path, $format)
          $synth.Rate = -1
          $synth.Speak($text)
          $synth.Dispose()

          $size = (Get-Item $path).Length
          if ($size -lt 20000) { throw "The synthesised WAV is only $size bytes." }

          Write-Host "Synthesised $size bytes of $language speech."
          "language=$language" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Download, verify and run each candidate
        shell: pwsh
        env:
          MODELS: ${{ inputs.models }}
          MEETINGRECORDER_TEST_AUDIO: ${{ github.workspace }}/.test-audio/speech.wav
          MEETINGRECORDER_TEST_LANGUAGE: ${{ steps.speech.outputs.language }}
          MEETINGRECORDER_REQUIRE_REAL_STT: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "${{ github.workspace }}/.models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          foreach ($name in ($env:MODELS -split '\s+' | Where-Object { $_ })) {
            $path = Join-Path $dir $name
            $url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$name"

            Write-Host "::group::$name"
            Write-Host "Fetching $url"
            Invoke-WebRequest -Uri $url -OutFile $path

            # Printed so the catalog's pinned values can be compared against what
            # was actually run here.
            $bytes = (Get-Item $path).Length
            $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            Write-Host "$name : $bytes bytes, sha256 $sha"

            $env:MEETINGRECORDER_TEST_MODEL = $path

            # The measurement itself is inside the test, which uses the same
            # decoding settings the application does.
            $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
            dotnet test tests/MeetingRecorder.Stt.Tests/MeetingRecorder.Stt.Tests.csproj `
              --configuration Release `
              --no-build `
              --filter "FullyQualifiedName~RealModelRecognitionTests" `
              --logger "console;verbosity=detailed"
            $stopwatch.Stop()

            Write-Host ("Wall clock for the whole test run with {0}: {1:N1} s" -f $name, $stopwatch.Elapsed.TotalSeconds)
            Remove-Item $path -Force
            Write-Host "::endgroup::"
          }
