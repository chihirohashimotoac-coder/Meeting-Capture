name: Verify model checksums

# Maintenance workflow, run on demand only.
#
# The application refuses to install an AI model whose SHA-256 does not match the
# value pinned in ModelCatalog.cs. Those pins were measured by this workflow, and
# this workflow re-measures them: run "verify" to confirm the pins still match
# what the publisher serves, or "refresh" to print new values after a publisher
# re-uploads a file.
#
# It downloads several GB, so it is never attached to a normal push.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'verify (fail on mismatch), refresh (print measured values) or measure (hash the URLs below)'
        required: true
        default: verify
        type: choice
        options: [verify, refresh, measure]
      urls:
        description: 'measure mode only: whitespace separated HTTPS URLs of candidate model files'
        required: false
        default: ''
        type: string
  schedule:
    # Monthly drift check: an upstream re-upload would otherwise only be
    # discovered by a user whose download suddenly fails verification.
    - cron: '0 3 1 * *'

permissions:
  contents: read

jobs:
  checksums:
    name: Measure the published model files
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the catalog parses before downloading anything
        # A mis-parsed catalog would hash the wrong files and report a false
        # result either way, so this runs first and costs no bandwidth.
        run: python3 tools/model_checksums.py selftest

      - name: Verify pinned SHA-256 values
        if: inputs.mode != 'measure'
        run: python3 tools/model_checksums.py "${{ inputs.mode || 'verify' }}"

      - name: Measure candidate model files
        # Used when a model is being considered for the catalog: its size and
        # SHA-256 have to be measured from the publisher's bytes before they can
        # be pinned, and guessing either value is not an option.
        if: inputs.mode == 'measure'
        env:
          CANDIDATE_URLS: ${{ inputs.urls }}
        run: python3 tools/model_checksums.py measure $CANDIDATE_URLS
