name: Resolve model checksums

# Maintenance workflow. It downloads every model in ModelCatalog and prints its
# SHA-256 so the catalog can pin a verified hash. It is not part of the build,
# never runs automatically on a normal push, and produces no artifact that ships
# to users.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/model-hashes.yml'

permissions:
  contents: read

jobs:
  checksums:
    name: Download models and print SHA-256
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract the model URLs from the catalog
        id: urls
        run: |
          grep -oP 'Url = "\K[^"]+' src/MeetingRecorder.Core/ModelManagement/ModelCatalog.cs \
            | sed 's|WhisperBaseUrl + ||' > urls.txt
          # The whisper entries are written as base + filename; rebuild them.
          grep -oP 'Url = WhisperBaseUrl \+ "\K[^"]+' src/MeetingRecorder.Core/ModelManagement/ModelCatalog.cs \
            | sed 's|^|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/|' >> urls.txt
          sort -u urls.txt | grep '^https://' > resolved.txt
          cat resolved.txt

      - name: Download and hash
        run: |
          set -euo pipefail
          echo "| file | bytes | sha256 |"
          echo "| --- | --- | --- |"
          while read -r url; do
            name=$(basename "$url")
            # Large models are streamed straight into sha256sum so the runner
            # never needs disk space for all of them at once.
            read -r size hash < <(curl -sSL "$url" | tee >(wc -c > /tmp/size) | sha256sum | cut -d' ' -f1 | { read h; echo "$(cat /tmp/size) $h"; })
            echo "| $name | $size | $hash |"
          done < resolved.txt
